<div class="spacin-container">
<div class="guest-container">
    <div class="head-line">
        <h2>
            Invitados especiales
        </h2>
        <div class="arrows">
            <button (click)="prev()">
                   <svg width="46" height="46" viewBox="0 0 46 46" fill="none" xmlns="http://www.w3.org/2000/svg">
<g opacity="0.5" clip-path="url(#clip0_2885_3792)">
<rect width="46" height="46" rx="23" fill="#F3F4F6"/>
<path d="M26.9999 15L19 23.0001L27 31" stroke="#594739" stroke-width="1.5" stroke-miterlimit="16"/>
</g>
<defs>
<clipPath id="clip0_2885_3792">
<rect width="46" height="46" fill="white"/>
</clipPath>
</defs>
</svg>
            </button>
             

            <button (click)="next()">
<svg width="46" height="46" viewBox="0 0 46 46" fill="none" xmlns="http://www.w3.org/2000/svg">
<g clip-path="url(#clip0_2885_3802)">
<rect width="46" height="46" rx="23" fill="#F3F4F6"/>
<path d="M19.0001 15L27 23.0001L19 31" stroke="#594739" stroke-width="1.5" stroke-miterlimit="16"/>
</g>
<defs>
<clipPath id="clip0_2885_3802">
<rect width="46" height="46" fill="white"/>
</clipPath>
</defs>
</svg>
</button>

        </div>
    </div>
    <div></div>
<div class="carousel-container">
  <div
    class="cards-container"
    [style.transform]="transform"
  >
  @for (video of cards; track $index) {
    <div class="card">
      <video [src]="'./assets/videos/'+video.video" autoplay muted></video>
      <div class="card-text">
  <h3> {{video.name}} </h3>
  <p> {{video.description}} </p>
</div>

    </div>
    
  }
  </div>
</div>

<!-- DOTS -->
<div class="carousel-dots">
  <span
    *ngFor="let dot of dots; let i = index"
    class="dot"
    [class.active]="i === currentStep"
  ></span>


</div>
<div class="container-button">
   <button class="contact-button">DESCUBRE TODOS LOS EPISODIOS</button>
</div>
</div>
</div>
