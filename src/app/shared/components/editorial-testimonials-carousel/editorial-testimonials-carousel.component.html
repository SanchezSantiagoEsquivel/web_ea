<div class="space-container">
@if (carouselData?.data) {

  <div class="icon">
    <svg width="3" height="122" viewBox="0 0 3 122" fill="none" xmlns="http://www.w3.org/2000/svg">
<path d="M1 0.5L1.00001 121.5" stroke="#A4978A" stroke-opacity="0.5" stroke-width="1.5"/>
<rect width="1.86875" height="4.95625" fill="#56483B"/>
</svg>

  </div>
  <div class="carousel-viewport">
    <!-- TRACK -->
    <div
       class="carousel-track"
  [style.transform]="'translateX(-' + currentIndex * 100 + '%)'"
    >
      @for (item of carouselData.data; track $index) {
        <div class="carousel-slide">
          <!-- ⬇️ TU DISEÑO TAL CUAL ⬇️ -->
          <div class="main-container">
            <div class="images">
              <img [src]="item.image" alt="">
            </div>

            <div class="information">
              <h3>{{ carouselData.name }}</h3>
              <h2>{{ item.headline }}</h2>

              <div class="description">
                <p>{{ item.description }}</p>
              </div>

              <div class="autor">
                <p>{{ item.author }}</p>
                <p class="position">{{ item.position }}</p>
              </div>
            </div>
          </div>
        </div>
      }
    </div>
  </div>
}
</div>
<div class="arrow-container">
  <button  (click)="prev()">
    <svg width="46" height="46" viewBox="0 0 46 46" fill="none" xmlns="http://www.w3.org/2000/svg">
<rect width="46" height="46" rx="23" fill="#F3F4F6"/>
<path d="M26.9999 15L19 23.0001L27 31" stroke="#594739" stroke-width="1.5" stroke-miterlimit="16"/>
</svg>

  </button>

  <button (click)="next()">
    <svg width="46" height="46" viewBox="0 0 46 46" fill="none" xmlns="http://www.w3.org/2000/svg">
<g clip-path="url(#clip0_2378_7709)">
<rect width="46" height="46" rx="23" fill="#F3F4F6"/>
<path d="M19.0001 15L27 23.0001L19 31" stroke="#594739" stroke-width="1.5" stroke-miterlimit="16"/>
</g>
<defs>
<clipPath id="clip0_2378_7709">
<rect width="46" height="46" fill="white"/>
</clipPath>
</defs>
</svg>

  </button>
</div>
